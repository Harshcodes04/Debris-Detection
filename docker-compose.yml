services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: sih-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sih_ps57

    ports:
      - "15432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: